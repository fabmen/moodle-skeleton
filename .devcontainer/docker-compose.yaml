version: '3'
services:
  cli:
    build:
      context: ./container/cli/.
      dockerfile: Dockerfile
      args: 
        - PHP_VERSION=8.4
        - TIMEZONE=Europe/Paris
        - OS_USERID=1000
        - OS_USERNAME=vscode  
    container_name: mdl-cli
    user: vscode
    command: sleep infinity
    depends_on:
        - db
    volumes:
        - mdl-vendor:/var/www/html/vendor
        - mdl-moodle:/var/www/html
        - ../data:/var/www/html/data
  
    environment: 
      MOODLE_AGREE_LICENSE: "Y"
      MOODLE_DB_USERNAME: ${MOODLE_DB_USERNAME}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASS}
      MOODLE_DB_HOST: ${MOODLE_DB_HOST}
      MOODLE_DB_PORT: ${MOODLE_DB_PORT}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_PREFIX: "mdl_"
      MOODLE_DB_DRIVER: "mariadb"
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_WWWROOT:
      COMPOSER_PROCESS_TIMEOUT: ${COMPOSER_TIMEOUT}
      COMPOSER_MEMORY_LIMIT: ${COMPOSER_MEMORY_LIMIT}
  
  web:
    build: 
      context: ./container/web/.
      dockerfile: Dockerfile
      args: 
        - UID=1000
        - GID=1000 
    container_name: mdl-web
    depends_on: 
      - php
      - db
    ports:
      - '8080:8080'
    volumes:
      - mdl-moodle:/var/www/html
      - ../data:/var/www/html/data
      - ./container/web/default.conf:/etc/nginx/conf.d/default.conf
#      - ./container/web/nginx.conf:/etc/nginx/nginx.conf
    user: "nginx"
  
  php:
    build:
      context: ./container/php/.
      dockerfile: Dockerfile
      args: 
        - PHP_VERSION=8.4
        - TIMEZONE=Europe/Paris
        - OS_USERID=1000
        - OS_USERNAME=vscode
    container_name: mdl-php
    volumes:
        - mdl-vendor:/var/www/html/vendor
        - mdl-moodle:/var/www/html
        - ../data:/var/www/html/data

    user: vscode

  db:
      image: yobasystems/alpine-mariadb
      #command: mysqld --default-authentication-plugin=mysql_native_password
      container_name: mdl-db
      volumes:
        - ../mariadb-data/:/var/lib/mysql
        - ../mariadb-backup:/docker-entrypoint-initdb.d
      environment:
        MYSQL_USER: ${MOODLE_DB_USER}
        MYSQL_PASSWORD: ${MOODLE_DB_PASS}
        MYSQL_DATABASE: ${MOODLE_DB_NAME}
        MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASS}
      expose:
        - "3306"
  # postgres:
  #   image: postgres:16.3-alpine
  #   environment:
  #     POSTGRES_DB: laravel
  #     POSTGRES_USER: root
  #     POSTGRES_HOST_AUTH_METHOD: trust
  redis:
    image: redis:alpine
    container_name: mdl-redis

  adminer:
    image: dockette/adminer:mysql
    container_name: mdl-adminer
    ports:
      - '8081:80'
volumes:
  mdl-vendor:
  mdl-moodle: